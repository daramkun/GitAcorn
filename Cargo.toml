[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/app-core",
  "crates/git-cli",
  "crates/git-domain",
  "crates/persistence",
  "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.17", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = true
