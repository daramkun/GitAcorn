[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/app-core",
  "crates/git-cli",
  "crates/git-domain",
  "crates/persistence",
  "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
uuid = { version = "1.17", features = ["serde", "v4", "v5"] }
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
