name: Desktop Alpha release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate SemVer tag and project versions
        id: release-version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pnpm version:check -- --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  linux-alpha:
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Prepare updater verification config
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PUBLIC_KEY"
          node <<'NODE'
          const fs = require("node:fs");
          const config = {
            bundle: { createUpdaterArtifacts: true },
            plugins: {
              updater: {
                pubkey: process.env.TAURI_SIGNING_PUBLIC_KEY,
                endpoints: [`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`],
              },
            },
          };
          fs.writeFileSync("apps/desktop/src-tauri/tauri.release.conf.json", JSON.stringify(config));
          NODE

      - name: Build Debian, AppImage, and updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate-version.outputs.tag }}
          releaseName: GitAcorn ${{ needs.validate-version.outputs.tag }} Alpha
          releaseBody: See docs/alpha-release.md for validation and known limitations.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Verify packages and launch AppImage
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          test -f "$appimage.sig"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -F 'usr/bin/git-acorn-desktop'
          bash scripts/smoke-linux-appimage.sh "$appimage"

  windows-alpha:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Prepare updater verification config
        shell: pwsh
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PUBLIC_KEY) { throw "TAURI_SIGNING_PUBLIC_KEY is required" }
          $config = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
                endpoints = @("https://github.com/${{ github.repository }}/releases/latest/download/latest.json")
                windows = @{ installMode = "passive" }
              }
            }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content apps/desktop/src-tauri/tauri.release.conf.json

      - name: Build signed installer and updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate-version.outputs.tag }}
          releaseName: GitAcorn ${{ needs.validate-version.outputs.tag }} Alpha
          releaseBody: See docs/alpha-release.md for validation and known limitations.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Smoke-test current-user installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "GitAcorn/git-acorn-desktop.exe"
          if (-not (Test-Path $installed)) { throw "Installed executable was not found at $installed" }
          $app = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed application exited during smoke test" }
          Stop-Process -Id $app.Id

  macos-alpha:
    needs: validate-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          certificate_path="$RUNNER_TEMP/git-acorn-certificate.p12"
          keychain_path="$RUNNER_TEMP/git-acorn.keychain-db"
          echo "GIT_ACORN_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"
          echo "GIT_ACORN_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
          )"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build notarized universal DMG and updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate-version.outputs.tag }}
          releaseName: GitAcorn ${{ needs.validate-version.outputs.tag }} Alpha
          releaseBody: See docs/alpha-release.md for validation and known limitations.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json

      - name: Verify signature, notarization, architecture, and launch
        shell: bash
        run: |
          set -euo pipefail
          app="target/universal-apple-darwin/release/bundle/macos/GitAcorn.app"
          dmg="$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -d "$app"
          test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$dmg"
          architectures="$(lipo -archs "$app/Contents/MacOS/git-acorn-desktop")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]
          open "$app"
          sleep 8
          pgrep -x git-acorn-desktop
          pkill -x git-acorn-desktop

      - name: Delete temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${GIT_ACORN_KEYCHAIN:-}" && -f "$GIT_ACORN_KEYCHAIN" ]]; then
            security delete-keychain "$GIT_ACORN_KEYCHAIN"
          fi
          rm -f "${GIT_ACORN_CERTIFICATE:-}"
