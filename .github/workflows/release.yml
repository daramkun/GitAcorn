name: Desktop Alpha release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate SemVer tag and project versions
        id: release-version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pnpm version:check -- --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  linux-alpha:
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Build unsigned Debian and AppImage packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.validate-version.outputs.tag }}
          releaseName: GitAcorn ${{ needs.validate-version.outputs.tag }} Alpha
          releaseBody: Unsigned alpha build. See docs/alpha-release.md for validation and installation warnings.
          releaseDraft: true
          prerelease: true

      - name: Verify packages and launch AppImage
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -F 'usr/bin/git-acorn-desktop'
          bash scripts/smoke-linux-appimage.sh "$appimage"

  windows-alpha:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Build unsigned installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.validate-version.outputs.tag }}
          releaseName: GitAcorn ${{ needs.validate-version.outputs.tag }} Alpha
          releaseBody: Unsigned alpha build. See docs/alpha-release.md for validation and installation warnings.
          releaseDraft: true
          prerelease: true

      - name: Smoke-test current-user installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "GitAcorn/git-acorn-desktop.exe"
          if (-not (Test-Path $installed)) { throw "Installed executable was not found at $installed" }
          $app = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed application exited during smoke test" }
          Stop-Process -Id $app.Id

  macos-alpha:
    needs: validate-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Build certificate-free universal DMG
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ needs.validate-version.outputs.tag }}
          releaseName: GitAcorn ${{ needs.validate-version.outputs.tag }} Alpha
          releaseBody: Unsigned alpha build. See docs/alpha-release.md for validation and installation warnings.
          releaseDraft: true
          prerelease: true
          args: --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json

      - name: Verify ad-hoc signature, architecture, and launch
        shell: bash
        run: |
          set -euo pipefail
          app="target/universal-apple-darwin/release/bundle/macos/GitAcorn.app"
          dmg="$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -d "$app"
          test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          architectures="$(lipo -archs "$app/Contents/MacOS/git-acorn-desktop")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]
          open "$app"
          sleep 8
          pgrep -x git-acorn-desktop
          pkill -x git-acorn-desktop
